<!-- public/dashboard/fees.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Management | Aurora Platform</title>
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <style>
        body { background-color: #f4f6f8; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar (Same) */
        .sidebar { width: 250px; background-color: var(--color-midnight-navy); color: var(--color-white); display: flex; flex-direction: column; }
        .sidebar-header { padding: var(--space-md); font-family: var(--font-heading); font-weight: 800; font-size: 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header span { color: var(--color-champagne-gold); }
        .sidebar-nav { padding: var(--space-sm) 0; flex: 1; overflow-y: auto; }
        .nav-item { display: block; padding: 0.75rem var(--space-md); color: rgba(255,255,255,0.8); font-weight: 500; }
        .nav-item:hover, .nav-item.active { background-color: rgba(255,255,255,0.1); color: var(--color-champagne-gold); border-left: 4px solid var(--color-champagne-gold); }

        /* Main Content */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .topbar { background: var(--color-white); height: 60px; padding: 0 var(--space-lg); display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow-sm); }
        .content-area { padding: var(--space-md); overflow-y: auto; flex: 1; }

        /* Table & Cards */
        .card { background: var(--color-white); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); padding: var(--space-md); margin-bottom: var(--space-md); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 12px; border-bottom: 2px solid var(--color-muted-sage); color: #666; font-size: 0.9rem; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #eee; color: var(--color-midnight-navy); }
        
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 700; }
        .badge-paid { background: #d1fae5; color: #059669; }
        .badge-unpaid { background: #fee2e2; color: #dc2626; }

        /* Payment Modal/Panel */
        .payment-panel {
            display: none; background: #f8fafc; padding: var(--space-md); border-radius: var(--radius-sm); border-left: 4px solid var(--color-champagne-gold); margin-bottom: var(--space-md);
        }
        .form-group input, .form-group select { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-family: var(--font-body); }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">AURORA <span>PORTAL</span></div>
        <nav class="sidebar-nav">
            <a href="/dashboard/admin.html" class="nav-item">Dashboard</a>
            <a href="/dashboard/admissions.html" class="nav-item">Admissions</a>
            <a href="/dashboard/students.html" class="nav-item">Students</a>
            <a href="/dashboard/attendance.html" class="nav-item">Attendance</a>
            <a href="/dashboard/fees.html" class="nav-item active">Fees & Payments</a>
        </nav>
        <div style="padding: var(--space-md);">
            <a href="/api/auth/logout" class="nav-item" style="border: 1px solid rgba(255,255,255,0.2); text-align: center; border-radius: 4px;">Logout</a>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h3 style="margin: 0; color: var(--color-midnight-navy);">Fee Management</h3>
        </header>

        <div class="content-area">
            
            <!-- Payment Recording Panel -->
            <div class="payment-panel" id="paymentPanel">
                <h3 style="margin-bottom: 10px;">Record Payment</h3>
                <p id="paymentStudentInfo" style="margin-bottom: 15px; font-weight: 600; color: var(--color-academic-blue);"></p>
                <form id="paymentForm" style="display: flex; gap: 15px; align-items: flex-end;">
                    <input type="hidden" id="payInvoiceId">
                    <div class="form-group">
                        <label>Amount (₹)</label>
                        <input type="number" id="payAmount" readonly style="background: #e9ecef;">
                    </div>
                    <div class="form-group">
                        <label>Payment Method</label>
                        <select id="payMethod" required>
                            <option value="Cash">Cash</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                            <option value="UPI">UPI / Online</option>
                            <option value="Cheque">Cheque</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary">Confirm Payment</button>
                    <button type="button" class="btn-secondary" onclick="closePaymentPanel()">Cancel</button>
                </form>
            </div>

            <div class="card">
                <h2 style="margin-bottom: var(--space-md); font-size: 1.5rem;">Student Invoices</h2>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Invoice No.</th>
                                <th>Student details</th>
                                <th>Class</th>
                                <th>Amount</th>
                                <th>Due Date</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="invoicesTableBody">
                            <tr><td colspan="7" style="text-align: center;">Loading invoices...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function loadInvoices() {
            try {
                const res = await fetch('/api/fees/invoices');
                if (res.status === 401) { window.location.href = '/login.html'; return; }
                const data = await res.json();
                
                const tbody = document.getElementById('invoicesTableBody');
                tbody.innerHTML = '';

                if (data.invoices.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">No invoices found.</td></tr>';
                    return;
                }

                data.invoices.forEach(inv => {
                    const badgeClass = inv.status === 'Paid' ? 'badge-paid' : 'badge-unpaid';
                    let actionButton = '';
                    
                    if(inv.status === 'Unpaid') {
                        actionButton = `<button onclick="openPaymentPanel(${inv.id}, '${inv.first_name} ${inv.last_name} (${inv.admission_number})', ${inv.amount}, '${inv.invoice_number}')" style="background:var(--color-academic-blue); color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">Collect Pay</button>`;
                    } else {
                        actionButton = `<span style="color: #059669; font-weight:bold;">Settled</span>`;
                    }

                    const row = `
                        <tr>
                            <td style="font-weight: 600;">${inv.invoice_number}</td>
                            <td>
                                <strong>${inv.first_name} ${inv.last_name}</strong><br>
                                <span style="font-size: 0.8rem; color:#666;">${inv.admission_number}</span>
                            </td>
                            <td>${inv.class_name || 'N/A'}</td>
                            <td style="font-weight: 700; color: var(--color-midnight-navy);">₹${parseFloat(inv.amount).toLocaleString('en-IN')}</td>
                            <td>${inv.due_date}</td>
                            <td><span class="badge ${badgeClass}">${inv.status}</span></td>
                            <td>${actionButton}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (e) {
                console.error(e);
                document.getElementById('invoicesTableBody').innerHTML = '<tr><td colspan="7" style="text-align: center; color: red;">Error loading data.</td></tr>';
            }
        }

        function openPaymentPanel(id, studentInfo, amount, invoiceNo) {
            document.getElementById('paymentPanel').style.display = 'block';
            document.getElementById('payInvoiceId').value = id;
            document.getElementById('payAmount').value = amount;
            document.getElementById('paymentStudentInfo').textContent = `Recording payment for: ${studentInfo} | Invoice: ${invoiceNo}`;
            window.scrollTo(0, 0);
        }

        function closePaymentPanel() {
            document.getElementById('paymentPanel').style.display = 'none';
        }

        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                invoiceId: document.getElementById('payInvoiceId').value,
                amountPaid: document.getElementById('payAmount').value,
                paymentMethod: document.getElementById('payMethod').value
            };

            try {
                const res = await fetch('/api/fees/pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                if(result.success) {
                    alert('Payment successful!');
                    closePaymentPanel();
                    loadInvoices(); // Refresh table
                } else {
                    alert(result.message);
                }
            } catch(e) {
                alert('Payment processing failed.');
            }
        });

        window.onload = loadInvoices;
    </script>
</body>
</html>
