<!-- public/dashboard/admissions.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Admissions | Aurora Platform</title>
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <style>
        body { background-color: #f4f6f8; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background-color: var(--color-midnight-navy); color: var(--color-white); display: flex; flex-direction: column; }
        .sidebar-header { padding: var(--space-md); font-family: var(--font-heading); font-weight: 800; font-size: 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header span { color: var(--color-champagne-gold); }
        .sidebar-nav { padding: var(--space-sm) 0; flex: 1; overflow-y: auto; }
        .nav-item { display: block; padding: 0.75rem var(--space-md); color: rgba(255,255,255,0.8); font-weight: 500; }
        .nav-item:hover, .nav-item.active { background-color: rgba(255,255,255,0.1); color: var(--color-champagne-gold); border-left: 4px solid var(--color-champagne-gold); }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .topbar { background: var(--color-white); height: 60px; padding: 0 var(--space-lg); display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow-sm); }
        .content-area { padding: var(--space-md); overflow-y: auto; flex: 1; }
        .card { background: var(--color-white); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); padding: var(--space-md); }
        
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 12px; border-bottom: 2px solid var(--color-muted-sage); color: #666; font-size: 0.9rem; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #eee; color: var(--color-midnight-navy); }
        tr:hover td { background-color: #f9fbfd; }
        
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 700; }
        .badge-pending { background: #fef3c7; color: #d97706; }
        .badge-approved { background: #d1fae5; color: #059669; }
        
        .btn-action { background: var(--color-champagne-gold); color: var(--color-midnight-navy); border: none; padding: 6px 12px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .btn-action:hover { background: var(--color-midnight-navy); color: var(--color-champagne-gold); }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">AURORA <span>PORTAL</span></div>
        <nav class="sidebar-nav">
            <a href="/dashboard/admin.html" class="nav-item">Dashboard</a>
            <a href="/dashboard/admissions.html" class="nav-item active">Admissions</a>
            <a href="/dashboard/students.html" class="nav-item">Students</a>
            <a href="/dashboard/attendance.html" class="nav-item">Attendance</a>
            <a href="/dashboard/fees.html" class="nav-item">Fees & Payments</a>
        </nav>
        <div style="padding: var(--space-md);">
            <a href="/api/auth/logout" class="nav-item" style="border: 1px solid rgba(255,255,255,0.2); text-align: center; border-radius: 4px;">Logout</a>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h3 style="margin: 0; color: var(--color-midnight-navy);">Admissions Management</h3>
        </header>

        <div class="content-area">
            <div class="card">
                <h2 style="margin-bottom: var(--space-md); font-size: 1.5rem;">Application Requests</h2>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Ref No.</th>
                                <th>Student Name</th>
                                <th>Grade Applied</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="applicationsTableBody">
                            <tr><td colspan="6" style="text-align: center;">Loading applications...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function loadApplications() {
            try {
                const res = await fetch('/api/admissions/list');
                if (res.status === 401) { window.location.href = '/login.html'; return; }
                const data = await res.json();
                
                const tbody = document.getElementById('applicationsTableBody');
                tbody.innerHTML = '';

                if(data.applications.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No applications found.</td></tr>';
                    return;
                }

                data.applications.forEach(app => {
                    const badgeClass = app.status === 'Approved' ? 'badge-approved' : 'badge-pending';
                    const actionBtn = app.status === 'Submitted' 
                        ? `<button class="btn-action" onclick="approveApplication('${app.id}')">Approve & Enroll</button>`
                        : `<span style="color: #059669; font-weight:600;">Enrolled ✓</span>`;

                    const row = `
                        <tr>
                            <td style="font-weight: 600;">${app.reference_number}</td>
                            <td>${app.student_first_name} ${app.student_last_name}</td>
                            <td>${app.applying_grade}</td>
                            <td>${app.date}</td>
                            <td><span class="badge ${badgeClass}">${app.status}</span></td>
                            <td>${actionBtn}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                console.error('Failed to load applications:', error);
            }
        }

        async function approveApplication(id) {
            if(!confirm("Are you sure you want to approve this application and enroll the student?")) return;

            try {
                const res = await fetch(`/api/admissions/approve/${id}`, { method: 'POST' });
                const result = await res.json();
                
                if(result.success) {
                    alert(result.message);
                    loadApplications(); // Reload table
                } else {
                    alert("Error: " + result.message);
                }
            } catch(e) {
                alert("Server error processing approval.");
            }
        }

        window.onload = loadApplications;
    </script>
</body>
</html>
