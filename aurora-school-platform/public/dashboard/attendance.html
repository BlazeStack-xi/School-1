<!-- public/dashboard/attendance.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance | Aurora Platform</title>
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <style>
        body { background-color: #f4f6f8; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 250px; background-color: var(--color-midnight-navy); color: var(--color-white); display: flex; flex-direction: column; }
        .sidebar-header { padding: var(--space-md); font-family: var(--font-heading); font-weight: 800; font-size: 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header span { color: var(--color-champagne-gold); }
        .sidebar-nav { padding: var(--space-sm) 0; flex: 1; overflow-y: auto; }
        .nav-item { display: block; padding: 0.75rem var(--space-md); color: rgba(255,255,255,0.8); font-weight: 500; }
        .nav-item:hover, .nav-item.active { background-color: rgba(255,255,255,0.1); color: var(--color-champagne-gold); border-left: 4px solid var(--color-champagne-gold); }

        /* Main Content */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .topbar { background: var(--color-white); height: 60px; padding: 0 var(--space-lg); display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow-sm); }
        .content-area { padding: var(--space-md); overflow-y: auto; flex: 1; }

        /* UI Elements */
        .card { background: var(--color-white); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); padding: var(--space-md); margin-bottom: var(--space-md); }
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: var(--space-md); align-items: end; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; }
        .form-control { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; font-family: var(--font-body); }
        
        table { width: 100%; border-collapse: collapse; text-align: left; margin-top: var(--space-md); }
        th { padding: 12px; border-bottom: 2px solid var(--color-muted-sage); color: #666; font-size: 0.9rem; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        
        /* Custom Radio Buttons */
        .radio-group { display: flex; gap: 15px; }
        .radio-label { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 0.9rem; font-weight: 600; }
        .radio-label input[value="Present"] { accent-color: #10b981; }
        .radio-label input[value="Absent"] { accent-color: #ef4444; }
        .radio-label input[value="Late"] { accent-color: #f59e0b; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">AURORA <span>PORTAL</span></div>
        <nav class="sidebar-nav">
            <a href="/dashboard/admin.html" class="nav-item">Dashboard</a>
            <a href="/dashboard/admissions.html" class="nav-item">Admissions</a>
            <a href="/dashboard/students.html" class="nav-item">Students</a>
            <a href="/dashboard/attendance.html" class="nav-item active">Attendance</a>
            <a href="/dashboard/fees.html" class="nav-item">Fees & Payments</a>
        </nav>
        <div style="padding: var(--space-md);">
            <a href="/api/auth/logout" class="nav-item" style="border: 1px solid rgba(255,255,255,0.2); text-align: center; border-radius: 4px;">Logout</a>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h3 style="margin: 0; color: var(--color-midnight-navy);">Mark Attendance</h3>
        </header>

        <div class="content-area">
            <div class="card">
                <div class="controls-grid">
                    <div class="form-group">
                        <label>Select Class</label>
                        <select id="classSelect" class="form-control">
                            <option value="">Loading classes...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="attendanceDate" class="form-control">
                    </div>
                    <button class="btn-primary" onclick="fetchStudents()">Load Roster</button>
                </div>
            </div>

            <div class="card" id="rosterCard" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="margin: 0;">Student Roster</h3>
                    <button class="btn-primary" onclick="saveAttendance()">Save Attendance</button>
                </div>
                <p id="saveMessage" style="color: #10b981; font-weight: 600; margin-top: 10px; display: none;"></p>

                <table>
                    <thead>
                        <tr>
                            <th>Roll/Adm No.</th>
                            <th>Student Name</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="rosterBody">
                        <!-- Data will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Set today's date as default
        document.getElementById('attendanceDate').valueAsDate = new Date();

        // Load classes on page load
        async function loadClasses() {
            try {
                const res = await fetch('/api/attendance/classes');
                if (res.status === 401) { window.location.href = '/login.html'; return; }
                const data = await res.json();
                
                const select = document.getElementById('classSelect');
                select.innerHTML = '<option value="">-- Select a Class --</option>';
                data.classes.forEach(c => {
                    select.innerHTML += `<option value="${c.id}">${c.name}</option>`;
                });
            } catch (e) { console.error('Error loading classes', e); }
        }

        // Fetch students for selected class
        async function fetchStudents() {
            const classId = document.getElementById('classSelect').value;
            if(!classId) return alert('Please select a class first.');

            try {
                const res = await fetch(`/api/attendance/students/${classId}`);
                const data = await res.json();
                
                const tbody = document.getElementById('rosterBody');
                tbody.innerHTML = '';

                if(data.students.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No students found in this class.</td></tr>';
                } else {
                    data.students.forEach(s => {
                        tbody.innerHTML += `
                            <tr data-studentid="${s.id}">
                                <td style="font-weight: 600;">${s.admission_number}</td>
                                <td>${s.first_name} ${s.last_name}</td>
                                <td>
                                    <div class="radio-group">
                                        <label class="radio-label"><input type="radio" name="att_${s.id}" value="Present" checked> Present</label>
                                        <label class="radio-label"><input type="radio" name="att_${s.id}" value="Absent"> Absent</label>
                                        <label class="radio-label"><input type="radio" name="att_${s.id}" value="Late"> Late</label>
                                    </div>
                                </td>
                            </tr>
                        `;
                    });
                }
                document.getElementById('rosterCard').style.display = 'block';
                document.getElementById('saveMessage').style.display = 'none';
            } catch (e) { console.error('Error fetching roster', e); }
        }

        // Save attendance to backend
        async function saveAttendance() {
            const date = document.getElementById('attendanceDate').value;
            if(!date) return alert('Please select a date.');

            const attendanceData = [];
            const rows = document.querySelectorAll('#rosterBody tr[data-studentid]');
            
            rows.forEach(row => {
                const studentId = row.getAttribute('data-studentid');
                const status = document.querySelector(`input[name="att_${studentId}"]:checked`).value;
                attendanceData.push({ student_id: studentId, status: status });
            });

            if(attendanceData.length === 0) return;

            try {
                const res = await fetch('/api/attendance/mark', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date, attendanceData })
                });
                const result = await res.json();
                
                if(result.success) {
                    const msg = document.getElementById('saveMessage');
                    msg.textContent = result.message;
                    msg.style.display = 'block';
                    setTimeout(() => msg.style.display = 'none', 3000);
                } else {
                    alert(result.message);
                }
            } catch (e) {
                console.error(e);
                alert('Error saving attendance.');
            }
        }

        window.onload = loadClasses;
    </script>
</body>
</html>
